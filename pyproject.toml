[project]
name = "first-real-app"
version = "0.1.0"
description = "AI receptionist for a small clinic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=2.52.0",
    "pypdf>=6.0,<7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
